name: 功能建议
description: 提议与互动故事插件直接相关的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前遇到了什么限制，涉及单人、多人、圆桌、存档还是绘图？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为，以及它与普通聊天链路如何共存。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如考虑过其他实现方式，可在这里说明。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 此建议不要求在仓库中内置第三方凭据或个人数据。
          required: true
